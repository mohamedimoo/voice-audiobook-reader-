<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Desktop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar" id="topbar"></header>
      <main class="view" id="library-view" aria-label="Library"></main>
      <section class="view player" id="player-view" aria-label="Player" hidden></section>
      <footer class="mini-player" id="mini-player" hidden></footer>
    </div>
    <div class="drop-overlay" id="drop-overlay" hidden>
      <div class="drop-card">
        <div class="drop-icon"></div>
        <strong>Drop to add to your library</strong>
        <span>Folders of audiobooks, a single book folder, or audio files</span>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div id="layer"></div>
    <script src="app.js"></script>
  </body>
</html>
