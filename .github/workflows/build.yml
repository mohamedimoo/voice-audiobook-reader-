name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg (used to generate test audio)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installer and portable exe
        run: npm run dist:win
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voice-desktop-windows
          path: |
            release/*.exe
          if-no-files-found: error
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Publishes the .exe files as a GitHub release for tags and for pushes to the
      # default branch (the release is named after the version in package.json and
      # its files are replaced on every build of that version).
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: Voice Desktop ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          body: |
            Windows build of Voice Desktop ${{ steps.version.outputs.version }}.

            - **Voice Desktop-${{ steps.version.outputs.version }}-portable.exe**: double-click to run, nothing to install.
            - **Voice Desktop-Setup-${{ steps.version.outputs.version }}.exe**: installer with Start Menu and desktop shortcuts.

            The files are not code-signed, so Windows SmartScreen may warn the first time: choose *More info → Run anyway*.
          files: release/*.exe
